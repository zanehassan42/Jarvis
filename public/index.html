<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vanta</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #030308;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    pointer-events: none;
    padding: 0 24px 40px;
    box-sizing: border-box;
  }

  #status {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(232, 195, 120, 0.55);
    margin-bottom: 14px;
    min-height: 16px;
    text-align: center;
  }

  .brand {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.55em;
    color: rgba(230, 220, 200, 0.5);
  }

  #reset-btn {
    position: fixed;
    top: 22px;
    right: 26px;
    background: none;
    border: none;
    color: rgba(230, 220, 200, 0.35);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    padding: 6px;
    transition: color 0.2s ease;
  }

  #reset-btn:hover {
    color: rgba(232, 195, 120, 0.8);
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <button id="reset-btn">Reset</button>

  <div class="overlay">
    <div id="status">Tap anywhere to speak</div>
    <div class="brand">V&nbsp;.&nbsp;A&nbsp;.&nbsp;N&nbsp;.&nbsp;T&nbsp;.&nbsp;A</div>
  </div>

<script>
  /* ======================= Portrait silhouette (profile — no eye contact) ======================= */

  const MASK_W = 300, MASK_H = 420;
  const PROFILE_PATH = new Path2D(`
    M 150 50
    C 192 52 222 84 228 122
    C 233 132 236 140 240 150
    C 246 158 254 162 252 172
    C 250 180 240 180 236 186
    C 233 191 238 194 238 199
    C 238 204 230 203 228 208
    C 226 213 232 214 230 219
    C 228 224 220 224 216 229
    C 212 236 206 240 198 240
    C 186 240 172 232 165 220
    C 158 228 152 236 150 248
    C 152 265 156 275 160 285
    C 180 300 210 315 228 340
    L 228 420
    L 62 420
    L 62 340
    C 80 315 100 300 118 285
    C 122 270 120 255 118 240
    C 116 220 100 210 92 190
    C 78 165 75 135 82 108
    C 90 80 110 60 150 50
    Z
  `);

  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = MASK_W;
  maskCanvas.height = MASK_H;
  const maskCtx = maskCanvas.getContext('2d');
  maskCtx.fillStyle = '#fff';
  maskCtx.fill(PROFILE_PATH);
  const maskData = maskCtx.getImageData(0, 0, MASK_W, MASK_H).data;

  function insideFace(x, y) {
    if (x < 0 || y < 0 || x >= MASK_W || y >= MASK_H) return false;
    return maskData[(((y | 0) * MASK_W) + (x | 0)) * 4 + 3] > 10;
  }

  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---- Approximate distance-to-edge transform, used as a relief/depth map
     so the particle field can be lit like a sculpted bust rather than a
     flat silhouette. Two-pass chamfer distance transform. ---- */

  const dist = new Float32Array(MASK_W * MASK_H);
  for (let y = 0; y < MASK_H; y++) {
    for (let x = 0; x < MASK_W; x++) {
      dist[y * MASK_W + x] = insideFace(x, y) ? Infinity : 0;
    }
  }
  const D1 = 1, D2 = 1.4142;
  for (let y = 0; y < MASK_H; y++) {
    for (let x = 0; x < MASK_W; x++) {
      const idx = y * MASK_W + x;
      if (dist[idx] === 0) continue;
      let v = dist[idx];
      if (x > 0) v = Math.min(v, dist[idx - 1] + D1);
      if (y > 0) v = Math.min(v, dist[idx - MASK_W] + D1);
      if (x > 0 && y > 0) v = Math.min(v, dist[idx - MASK_W - 1] + D2);
      if (x < MASK_W - 1 && y > 0) v = Math.min(v, dist[idx - MASK_W + 1] + D2);
      dist[idx] = v;
    }
  }
  for (let y = MASK_H - 1; y >= 0; y--) {
    for (let x = MASK_W - 1; x >= 0; x--) {
      const idx = y * MASK_W + x;
      if (dist[idx] === 0) continue;
      let v = dist[idx];
      if (x < MASK_W - 1) v = Math.min(v, dist[idx + 1] + D1);
      if (y < MASK_H - 1) v = Math.min(v, dist[idx + MASK_W] + D1);
      if (x < MASK_W - 1 && y < MASK_H - 1) v = Math.min(v, dist[idx + MASK_W + 1] + D2);
      if (x > 0 && y < MASK_H - 1) v = Math.min(v, dist[idx + MASK_W - 1] + D2);
      dist[idx] = v;
    }
  }
  let maxDist = 0;
  for (let i = 0; i < dist.length; i++) if (isFinite(dist[i]) && dist[i] > maxDist) maxDist = dist[i];

  const SHADOW_GOLD = { r: 58, g: 36, b: 10 };
  const HIGHLIGHT_GOLD = { r: 255, g: 244, b: 205 };
  function lerpColor(a, b, t) {
    return {
      r: a.r + (b.r - a.r) * t,
      g: a.g + (b.g - a.g) * t,
      b: a.b + (b.b - a.b) * t
    };
  }

  const faceParticles = [];
  const SPACING = 3.4;
  for (let y = 0; y < MASK_H; y += SPACING) {
    for (let x = 0; x < MASK_W; x += SPACING) {
      const jx = x + rand(-1.2, 1.2);
      const jy = y + rand(-1.2, 1.2);
      if (insideFace(jx, jy)) {
        const depthNorm = Math.min(1, dist[((jy | 0) * MASK_W) + (jx | 0)] / maxDist);
        const x0Norm = jx / MASK_W;
        const y0Norm = jy / MASK_H;
        // Key light from above and from the face side — models volume like a lit bust
        const lightFactor = (1 - y0Norm) * 0.6 + x0Norm * 0.4;
        const reliefRaw = Math.max(0, Math.min(1, depthNorm * 0.5 + lightFactor * 0.5));
        // Push contrast so the highlight/shadow read as real volume, not a soft tint
        const relief = Math.pow(reliefRaw, 1.6);
        const col = lerpColor(SHADOW_GOLD, HIGHLIGHT_GOLD, relief);

        faceParticles.push({
          bx: jx - MASK_W / 2,
          by: jy,
          phase: rand(0, Math.PI * 2),
          speed: rand(0.5, 1.3),
          r: rand(0.8, 1.6),
          driftPhaseX: rand(0, Math.PI * 2),
          driftPhaseY: rand(0, Math.PI * 2),
          color: col
        });
      }
    }
  }

  /* ======================= Canvas + resize ======================= */

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ======================= Ambient full-page mist ======================= */

  const ambientBlobs = [];
  for (let i = 0; i < 14; i++) {
    ambientBlobs.push({
      ox: rand(0, 1),
      oy: rand(0, 1),
      r: rand(130, 280),
      speed: rand(0.02, 0.06),
      phase: rand(0, Math.PI * 2),
      driftX: rand(40, 110),
      driftY: rand(30, 90)
    });
  }

  /* ======================= Head mist (state-reactive cloud) ======================= */

  const headMistBlobs = [];
  for (let i = 0; i < 18; i++) {
    headMistBlobs.push({
      angle: rand(0, Math.PI * 2),
      radiusBase: rand(0.55, 1.25),
      radiusVar: rand(0.2, 0.5),
      speed: rand(0.15, 0.45),
      phase: rand(0, Math.PI * 2),
      size: rand(55, 165)
    });
  }

  /* ======================= State machine (mist only — the figure stays gold) ======================= */

  const PALETTES = {
    idle:      { mistR: 150, mistG: 120, mistB: 80,  turbulence: 0.4,  jitter: 0.6, flicker: 0.55, pulse: 0 },
    listening: { mistR: 140, mistG: 170, mistB: 120, turbulence: 0.65, jitter: 0.9, flicker: 0.8,  pulse: 0.4 },
    thinking:  { mistR: 160, mistG: 110, mistB: 200, turbulence: 1.7,  jitter: 2.6, flicker: 1.3,  pulse: 0.2 },
    speaking:  { mistR: 210, mistG: 160, mistB: 90,  turbulence: 1.05, jitter: 1.1, flicker: 1.6,  pulse: 1 }
  };

  let currentState = 'idle';
  const live = { ...PALETTES.idle };

  function lerp(a, b, t) { return a + (b - a) * t; }

  function updateLive(dt) {
    const target = PALETTES[currentState];
    const t = Math.min(1, dt * 2.2);
    for (const key in target) {
      live[key] = lerp(live[key], target[key], t);
    }
  }

  /* ======================= Render loop ======================= */

  let lastT = performance.now();

  function draw(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    const t = now / 1000;

    updateLive(dt);

    // Trailing fade — slow, so the mist lingers and drifts instead of
    // refreshing instantly frame to frame.
    ctx.fillStyle = 'rgba(3, 3, 8, 0.22)';
    ctx.fillRect(0, 0, W, H);

    drawAmbientMist(t);
    drawHeadMist(t);
    drawFaceParticles(t);

    requestAnimationFrame(draw);
  }

  function drawAmbientMist(t) {
    for (const b of ambientBlobs) {
      const cx = (b.ox * W) + Math.sin(t * b.speed + b.phase) * b.driftX;
      const cy = (b.oy * H) + Math.cos(t * b.speed * 0.8 + b.phase) * b.driftY;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, b.r);
      g.addColorStop(0, `rgba(${live.mistR | 0}, ${live.mistG | 0}, ${live.mistB | 0}, 0.09)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - b.r, cy - b.r, b.r * 2, b.r * 2);
    }
  }

  function headOrigin() {
    const topMargin = H * 0.08;
    const bottomTarget = H * 0.78;
    const scale = (bottomTarget - topMargin) / MASK_H;
    return {
      x: W / 2,
      y: topMargin,
      scale
    };
  }

  function drawHeadMist(t) {
    const { x: ox, y: oy, scale } = headOrigin();
    const turb = live.turbulence;
    const pulse = 1 + Math.sin(t * 3.2) * live.pulse * 0.25;

    for (const b of headMistBlobs) {
      const wobble = Math.sin(t * b.speed * turb + b.phase) * b.radiusVar;
      const radius = (b.radiusBase + wobble) * MASK_H * scale * 0.62;
      const ang = b.angle + t * 0.05 * turb;
      const cx = ox + Math.cos(ang) * radius * 0.9;
      const cy = oy - MASK_H * scale * 0.15 + Math.sin(ang) * radius * 1.05;
      const size = b.size * scale * pulse * (0.7 + turb * 0.25);

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, size);
      g.addColorStop(0, `rgba(${live.mistR | 0}, ${live.mistG | 0}, ${live.mistB | 0}, ${0.26 * pulse})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - size, cy - size, size * 2, size * 2);
    }
  }

  function drawFaceParticles(t) {
    const { x: ox, y: oy, scale } = headOrigin();
    const floatY = Math.sin(t * 0.4) * 6;
    const jitterAmp = live.jitter;
    const flickerSpeed = live.flicker;

    // Gentle floating rotation — the pseudo-3D relief lighting plus this
    // slow sway is what sells the "floating goddess head" feel without a
    // real 3D engine.
    const rotation = Math.sin(t * 0.15) * 0.07;
    const pivotY = oy + 150 * scale;

    ctx.save();
    ctx.translate(ox, pivotY);
    ctx.rotate(rotation);
    ctx.translate(-ox, -pivotY);

    for (const p of faceParticles) {
      const dx = Math.sin(t * 0.6 * p.speed + p.driftPhaseX) * jitterAmp;
      const dy = Math.cos(t * 0.5 * p.speed + p.driftPhaseY) * jitterAmp;

      const sx = ox + (p.bx + dx) * scale;
      const sy = oy + floatY + (p.by + dy) * scale;

      const flicker = 0.65 + Math.sin(t * flickerSpeed * p.speed + p.phase) * 0.35;
      const alpha = Math.max(0.15, Math.min(1, flicker));

      ctx.beginPath();
      ctx.arc(sx, sy, p.r * scale * (SPACING * 0.32), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color.r | 0}, ${p.color.g | 0}, ${p.color.b | 0}, ${alpha})`;
      ctx.fill();
    }
    ctx.restore();
  }

  requestAnimationFrame(draw);

  /* ======================= App logic (speech in/out, chat, memory) ======================= */

  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset-btn');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusEl.textContent = 'Speech recognition not supported in this browser';
  }

  let recognition = null;
  let isListening = false;

  function setState(state) {
    currentState = state;
    if (state === 'listening') {
      statusEl.textContent = 'Listening…';
    } else if (state === 'thinking') {
      statusEl.textContent = 'Thinking…';
    } else if (state === 'speaking') {
      statusEl.textContent = 'Speaking…';
    } else {
      statusEl.textContent = 'Tap anywhere to speak';
    }
  }

  async function sendToVanta(text) {
    setState('thinking');
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) {
        throw new Error('Server responded with ' + res.status);
      }

      const data = await res.json();
      const reply = data.response || 'Sorry, I did not get a response.';
      speak(reply);
    } catch (err) {
      console.error(err);
      speak('Sorry, I ran into an error talking to the server.');
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) {
      setState('idle');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.onstart = () => setState('speaking');
    utterance.onend = () => setState('idle');
    utterance.onerror = () => setState('idle');
    window.speechSynthesis.speak(utterance);
  }

  function startListening() {
    if (!SpeechRecognition || isListening) return;

    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      setState('listening');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      sendToVanta(transcript);
    };

    recognition.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      isListening = false;
      setState('idle');
    };

    recognition.onend = () => {
      isListening = false;
      if (currentState === 'listening') {
        setState('idle');
      }
    };

    recognition.start();
  }

  canvas.addEventListener('click', () => {
    if (isListening) {
      recognition && recognition.stop();
      return;
    }
    window.speechSynthesis && window.speechSynthesis.cancel();
    startListening();
  });

  resetBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    window.speechSynthesis && window.speechSynthesis.cancel();
    setState('idle');
    try {
      await fetch('/reset', { method: 'POST' });
    } catch (err) {
      console.error('Failed to reset conversation:', err);
    }
  });
</script>
</body>
</html>
